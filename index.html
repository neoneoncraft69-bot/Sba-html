<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Super Bear Adventure Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .game-container {
            position: relative;
            max-width: 100%;
        }
        iframe {
            max-width: 100%;
            border: none;
        }
        .bottom-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px; 
            background-color: black;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <iframe 
            src="https://www.gameflare.com/embed/super-bear-adventure/" 
            width="900" 
            height="635" 
            allowfullscreen
            frameborder="0" 
            scrolling="no">
        </iframe>
        <div class="bottom-overlay"></div>
    </div>
</body>
</html>
